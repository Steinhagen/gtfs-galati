<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transurb Galati - GTFS viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1200; background: #fff;
    border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.3); padding: 10px 12px;
    font-size: 13px; max-width: 250px; max-height: calc(100% - 40px); overflow: auto;
  }
  #panel h1 { font-size: 15px; margin: 0 0 6px; }
  #panel label { display: block; margin: 3px 0; }
  #panel select { width: 100%; margin-top: 4px; }
  .swatch { display:inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .mode { color: #777; font-size: 11px; }
  #status { color: #666; margin-top: 6px; font-size: 12px; }
  .stop-label span {
    white-space: nowrap; font-size: 11px; font-family: system-ui, sans-serif;
    background: rgba(255,255,255,0.9); padding: 1px 4px; border-radius: 3px;
    border: 1px solid #999; box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .stop-label b { color: #333; }
</style>
</head>
<body>
<div id="panel">
  <h1>Transurb Galați &mdash; GTFS</h1>
  <label><input type="checkbox" id="cStops" checked> Show stops</label>
  <label><input type="checkbox" id="cLabels" checked> Show labels</label>
  <label><input type="checkbox" id="cBoth"> Show both directions</label>
  <label>Route:
    <select id="routeSelect"></select>
  </label>
  <label>Direction:
    <select id="dirSelect"></select>
  </label>
  <label>Highlight trip:
    <select id="tripSelect"></select>
  </label>
  <div id="status">loading&hellip;</div>
</div>
<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
const map = L.map('map', { zoomControl: false }).setView([45.442, 28.042], 13);
L.control.zoom({ position: 'bottomright' }).addTo(map);
window.addEventListener('resize', () => map.invalidateSize());
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines[0].split(',');
  return lines.slice(1).filter(l => l.trim()).map(l => {
    const c = l.split(',');
    const o = {};
    header.forEach((h, i) => o[h.trim()] = (c[i] ?? '').trim());
    return o;
  });
}

const MODE = { '3': 'bus', '11': 'trolleybus', '0': 'tram', '1': 'subway', '4': 'ferry' };

let stopsById = {}, stopsLayer, routesById = {}, routeList = [];
let routeLayers = {};      // route_id -> array of polyline layers
let tripFeatures = [];     // {route, trip, seq}

async function init() {
  const [stops, routes, trips, stimes, shapes] = await Promise.all([
    fetch('stops.txt').then(r => r.text()).then(parseCSV),
    fetch('routes.txt').then(r => r.text()).then(parseCSV),
    fetch('trips.txt').then(r => r.text()).then(parseCSV),
    fetch('stop_times.txt').then(r => r.text()).then(parseCSV),
    fetch('shapes.txt').then(r => r.text()).then(parseCSV),
  ]);

  stops.forEach(s => stopsById[s.stop_id] = s);
  routes.forEach(r => { routesById[r.route_id] = r; routeList.push(r); });
  routeList.sort((a, b) => (+a.route_id) - (+b.route_id));

  // stop markers (filtered to the selected route by renderStops)
  stopsLayer = L.featureGroup();
  stopsLayer.addTo(map);

  // group stop_times by trip, order by stop_sequence
  const stByTrip = {};
  stimes.forEach(st => (stByTrip[st.trip_id] = stByTrip[st.trip_id] || []).push(st));
  Object.values(stByTrip).forEach(arr => arr.sort((a, b) => +a.stop_sequence - +b.stop_sequence));

  // which stops belong to each route/direction
  const tripInfo = {};
  trips.forEach(t => tripInfo[t.trip_id] = { rid: t.route_id, dir: t.direction_id == 0 ? 'TUR' : 'RETUR' });
  const routeStopIds = {};
  stimes.forEach(st => {
    const info = tripInfo[st.trip_id];
    if (info) {
      routeStopIds[info.rid] = routeStopIds[info.rid] || { TUR: new Set(), RETUR: new Set() };
      routeStopIds[info.rid][info.dir].add(st.stop_id);
    }
  });

  // shapes: shape_id -> ordered [lat, lon] points
  const shapePoints = {};
  shapes.forEach(sh => (shapePoints[sh.shape_id] = shapePoints[sh.shape_id] || []));
  shapes.forEach(sh => shapePoints[sh.shape_id][+sh.shape_pt_sequence - 1] = [+sh.shape_pt_lat, +sh.shape_pt_lon]);

  // one polyline per unique shape (all trips of a direction share it)
  const seenShapes = {};
  trips.forEach(t => {
    const r = routesById[t.route_id];
    if (!r || seenShapes[t.shape_id]) return;
    seenShapes[t.shape_id] = true;
    let latlngs = shapePoints[t.shape_id] || [];
    if (!latlngs.length) {
      const seq = stByTrip[t.trip_id] || [];
      latlngs = seq.map(st => {
        const s = stopsById[st.stop_id];
        return s ? [+s.stop_lat, +s.stop_lon] : null;
      }).filter(Boolean);
    }
    if (latlngs.length < 2) return;
    const dir = t.direction_id == 0 ? 'TUR' : 'RETUR';
    const line = L.polyline(latlngs, {
      color: '#' + r.route_color, weight: 2.5, opacity: 0.85
    }).bindTooltip(`${r.route_short_name} · ${dir} (shape)`);
    (routeLayers[r.route_id] = routeLayers[r.route_id] || { TUR: [], RETUR: [] })[dir].push(line);
  });

  // all trips (for the dropdown), no lines
  trips.forEach(t => {
    const r = routesById[t.route_id];
    if (!r) return;
    const seq = stByTrip[t.trip_id] || [];
    if (seq.length < 2) return;
    tripFeatures.push({ route: r, trip: t, seq,
                        dir: t.direction_id == 0 ? 'TUR' : 'RETUR' });
  });

  // route select + trip select
  const routeSel = document.getElementById('routeSelect');
  routeList.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.route_id;
    opt.textContent = `${r.route_short_name} ${r.route_long_name} (${MODE[r.route_type] || 'transit'})`;
    routeSel.appendChild(opt);
  });

  // Which directions a route actually has. Most have TUR and RETUR, route 38 is
  // a loop with only TUR, so the direction select is built per route instead of
  // being hardcoded to both.
  function directionsOf(rid) {
    const dirs = [];
    ['TUR', 'RETUR'].forEach(d => {
      if (tripFeatures.some(f => f.route.route_id === rid && f.dir === d)) dirs.push(d);
    });
    return dirs;
  }

  // The direction being shown: whatever the direction select holds, falling back
  // to the route's first available one.
  function selectedDirection() {
    const rid = document.getElementById('routeSelect').value;
    const value = document.getElementById('dirSelect').value;
    const dirs = directionsOf(rid);
    return dirs.includes(value) ? value : (dirs[0] || 'TUR');
  }

  function populateDirections() {
    const rid = document.getElementById('routeSelect').value;
    const sel = document.getElementById('dirSelect');
    const previous = sel.value;
    const dirs = directionsOf(rid);
    sel.innerHTML = '';
    dirs.forEach(d => {
      const n = tripFeatures.filter(f => f.route.route_id === rid && f.dir === d).length;
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = `${d} (${n} trip${n === 1 ? '' : 's'})`;
      sel.appendChild(opt);
    });
    // keep the direction across route changes when the new route has it
    if (dirs.includes(previous)) sel.value = previous;
    sel.disabled = dirs.length < 2;
  }

  // show the selected route's shapes (direction of the selected trip,
  // or both when the "both directions" box is checked)
  function showRoute(rid) {
    const showBoth = document.getElementById('cBoth').checked;
    const wantDir = selectedDirection();
    Object.entries(routeLayers).forEach(([r2, dirs]) => {
      const onRoute = r2 === rid;
      Object.entries(dirs).forEach(([dir, lines]) => {
        const show = onRoute && (showBoth || dir === wantDir);
        lines.forEach(l => show ? l.addTo(map) : map.removeLayer(l));
      });
    });
  }

  function renderStops() {
    stopsLayer.clearLayers();
    const rid = document.getElementById('routeSelect').value;
    const r = routesById[rid];
    const stopColor = r ? '#' + r.route_color : '#058B8C';
    const showBoth = document.getElementById('cBoth').checked;
    const dirSets = routeStopIds[rid] || {};
    const ids = new Set();
    if (showBoth) {
      Object.values(dirSets).forEach(s => s.forEach(id => ids.add(id)));
    } else {
      (dirSets[selectedDirection()] || new Set()).forEach(id => ids.add(id));
    }
    stops.forEach(s => {
      if (!ids.has(s.stop_id)) return;
      const m = L.circleMarker([s.stop_lat, s.stop_lon], { radius: 6, color: '#333', weight: 1, fillColor: stopColor, fillOpacity: 0.9 });
      m.bindTooltip(s.stop_name);
      stopsLayer.addLayer(m);
    });
  }

  // Trips of the selected route *and* direction, earliest departure first, with
  // a "none" entry so the direction can be shown without singling out a trip.
  function populateTrips() {
    const rid = document.getElementById('routeSelect').value;
    const dir = selectedDirection();
    const sel = document.getElementById('tripSelect');
    sel.innerHTML = '';
    const none = document.createElement('option');
    none.value = '';
    none.textContent = '— whole direction —';
    sel.appendChild(none);
    tripFeatures
      .filter(f => f.route.route_id === rid && f.dir === dir)
      .sort((a, b) => (a.seq[0].departure_time || '').localeCompare(b.seq[0].departure_time || ''))
      .forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.trip.trip_id;
        const time = (f.seq[0].departure_time || '').replace(/:00$/, '');
        opt.textContent = `${time}  ${f.trip.service_id}  → ${f.trip.trip_headsign}`;
        sel.appendChild(opt);
      });
  }

  function renderLabels() {
    if (window._stopLabels) { window._stopLabels.forEach(l => l.remove()); window._stopLabels = null; }
    if (!document.getElementById('cLabels').checked) return;

    const labels = [];
    const rid = document.getElementById('routeSelect').value;
    const showBoth = document.getElementById('cBoth').checked;
    const id = document.getElementById('tripSelect').value;
    const f = id && tripFeatures.find(x => x.trip.trip_id === id);

    // Build a map of stop_id -> time from the selected trip
    const tripTimes = {};
    if (f) {
      f.seq.forEach(st => {
        const time = (st.departure_time || st.arrival_time || '').replace(/:00$/, '');
        tripTimes[st.stop_id] = time;
      });
    }

    // Determine which stops should have labels (same logic as renderStops)
    const dirSets = routeStopIds[rid] || {};
    const ids = new Set();
    if (showBoth) {
      Object.values(dirSets).forEach(s => s.forEach(id => ids.add(id)));
    } else {
      (dirSets[selectedDirection()] || new Set()).forEach(id => ids.add(id));
    }

    stops.forEach(s => {
      if (!ids.has(s.stop_id)) return;
      const time = tripTimes[s.stop_id];
      const text = time ? `${s.stop_name} <b>${time}</b>` : s.stop_name;
      const label = L.marker([+s.stop_lat, +s.stop_lon], {
        icon: L.divIcon({
          className: 'stop-label',
          html: `<span>${text}</span>`,
          iconSize: null,
          iconAnchor: [-8, 12]
        })
      }).addTo(map);
      labels.push(label);
    });
    window._stopLabels = labels;
  }

  function highlight() {
    if (window._hl) { window._hl.remove(); window._hl = null; }
    if (window._stopLabels) { window._stopLabels.forEach(l => l.remove()); window._stopLabels = null; }
    showRoute(document.getElementById('routeSelect').value);
    if (document.getElementById('cStops').checked) {
      renderStops();
      stopsLayer.addTo(map);
      stopsLayer.bringToFront();
    }
    renderLabels();

    const rid = document.getElementById('routeSelect').value;
    const dir = selectedDirection();
    const id = document.getElementById('tripSelect').value;
    const route = routesById[rid];

    // No trip picked: frame the whole direction and report what it holds.
    if (!id) {
      const dirs = document.getElementById('cBoth').checked ? directionsOf(rid) : [dir];
      const group = L.featureGroup(
        dirs.flatMap(d => (routeLayers[rid] || {})[d] || []));
      if (group.getLayers().length) map.fitBounds(group.getBounds());
      const of = tripFeatures.filter(f => f.route.route_id === rid && dirs.includes(f.dir));
      const byService = {};
      of.forEach(f => byService[f.trip.service_id] = (byService[f.trip.service_id] || 0) + 1);
      const services = Object.entries(byService)
        .map(([s, n]) => `${n} on ${s}`).join(', ') || 'no trips';
      const heads = [...new Set(of.map(f => f.trip.trip_headsign))].join(' / ');
      document.getElementById('status').innerHTML =
        `Route <b>${route ? route.route_short_name : rid}</b> ${dirs.join(' + ')}` +
        (heads ? ` &rarr; ${heads}` : '') + `<br>${of.length} trips (${services})`;
      return;
    }

    const f = tripFeatures.find(x => x.trip.trip_id === id);
    if (!f) return;
    let latlngs = shapePoints[f.trip.shape_id] || [];
    if (!latlngs.length) {
      latlngs = f.seq.map(st => {
        const s = stopsById[st.stop_id];
        return s ? [+s.stop_lat, +s.stop_lon] : null;
      }).filter(Boolean);
    }
    const hl = L.polyline(latlngs, { color: '#' + f.route.route_color, weight: 5, opacity: 0.95 }).addTo(map);
    window._hl = hl;

    map.fitBounds(hl.getBounds());
    const first = (f.seq[0].departure_time || '').replace(/:00$/, '');
    const last = (f.seq[f.seq.length - 1].arrival_time || '').replace(/:00$/, '');
    document.getElementById('status').innerHTML =
      `Route <b>${f.route.route_short_name}</b> ${f.dir} &rarr; ${f.trip.trip_headsign}` +
      `<br>${f.trip.service_id} ${first}&ndash;${last}, ${f.seq.length} stops` +
      `<br><span class="mode">${id}</span>`;
  }

  document.getElementById('cStops').addEventListener('change', e => {
    if (e.target.checked) {
      renderStops();
      stopsLayer.addTo(map);
      stopsLayer.bringToFront();
    } else {
      map.removeLayer(stopsLayer);
    }
  });
  document.getElementById('cBoth').addEventListener('change', highlight);
  document.getElementById('cLabels').addEventListener('change', () => renderLabels());
  routeSel.addEventListener('change', () => {
    populateDirections();
    populateTrips();
    showRoute(routeSel.value);
    renderStops();
    if (document.getElementById('cStops').checked) {
      stopsLayer.addTo(map);
      stopsLayer.bringToFront();
    }
    highlight();
  });
  // Changing direction re-filters the trip list and shows that direction whole,
  // rather than keeping a trip from the direction just left behind.
  document.getElementById('dirSelect').addEventListener('change', () => {
    populateTrips();
    highlight();
  });
  document.getElementById('tripSelect').addEventListener('change', highlight);
  window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (window._hl) { window._hl.remove(); window._hl = null; } if (window._stopLabels) { window._stopLabels.forEach(l => l.remove()); window._stopLabels = null; } } });

  populateDirections();
  populateTrips();
  showRoute(routeSel.value);
  renderStops();
  stopsLayer.bringToFront();
  highlight();
}

init().catch(err => {
  document.getElementById('status').textContent = 'Error: ' + err.message;
});
</script>
</body>
</html>
