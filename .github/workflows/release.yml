---
name: Publish GTFS release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtfs-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate GTFS feed
        run: python generate_gtfs.py

      - name: Set up Java (for GTFS validation)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate feed with MobilityData GTFS validator
        run: |
          curl -fsSL -o gtfs-validator.jar \
            "https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar"
          java -jar gtfs-validator.jar -i gtfs_transurb.zip -o validation-report
          python - <<'PYEOF'
          import json
          report = json.load(open("validation-report/report.json"))
          errors = [n for n in report["notices"] if n.get("severity") == "ERROR"]
          if errors:
              codes = {}
              for n in errors:
                  codes[n.get("code")] = codes.get(n.get("code"), 0) + 1
              raise SystemExit(f"GTFS validation failed: {codes}")
          print("GTFS validation passed (0 errors)")
          PYEOF

      - name: Publish release archive (static URL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="gtfs-latest"
          ASSET="gtfs-transurb.zip"
          mv gtfs_transurb.zip "$ASSET"
          # Replace the previous release that uses the same fixed tag.
          OLD_ID="$(gh api "repos/$REPO/releases/tags/$TAG" -q .id 2>/dev/null || true)"
          if [ -n "$OLD_ID" ]; then
            gh api -X DELETE "repos/$REPO/releases/$OLD_ID" >/dev/null
            gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" >/dev/null || true
          fi
          gh release create "$TAG" "$ASSET" --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "GTFS feed (latest)" \
            --notes "Regenerated GTFS feed for TRANSURB S.A. Galati.

          Static download URLs (never change):
          - https://github.com/$REPO/releases/latest/download/$ASSET
          - https://github.com/$REPO/releases/download/$TAG/$ASSET"
